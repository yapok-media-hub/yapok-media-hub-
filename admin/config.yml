# Administration du hub Yapok Média (Decap CMS)
# À compléter avant la mise en ligne : backend.repo, backend.base_url et site_url (voir README.md).
# Chaque élément a un bloc « Traductions » (pt, en, nl, es) : vide = le français s'affiche.
backend:
  name: github
  repo: VOTRE-COMPTE-GITHUB/yapok-media-hub
  branch: main
  base_url: https://www.votre-domaine.fr
  auth_endpoint: /api/auth
publish_mode: editorial_workflow
locale: fr
site_url: https://www.votre-domaine.fr
logo_url: /assets/img/logo-moyapok-512.jpg
media_folder: assets/uploads
public_folder: assets/uploads
collections:
- name: reglages
  label: Réglages du site
  editor:
    preview: false
  files:
  - name: site
    label: Informations générales
    file: data/site.json
    format: json
    fields:
    - name: nom
      label: Nom du hub
      widget: string
    - name: slogan
      label: Slogan
      widget: string
    - name: presentation
      label: Présentation
      widget: text
    - name: association
      label: Association
      widget: object
      fields:
      - name: nom
        label: Nom
        widget: string
      - name: forme
        label: Forme juridique
        widget: string
      - name: siren
        label: SIREN
        widget: string
      - name: adresse
        label: Adresse
        widget: string
      - name: email
        label: E-mail
        widget: string
      - name: telephone
        label: Téléphone
        widget: string
    - name: media
      label: Yapok Média
      widget: object
      fields:
      - name: email
        label: E-mail
        widget: string
    - name: reseaux
      label: Réseaux sociaux (liens complets, laisser vide pour masquer)
      widget: object
      fields:
      - name: youtube
        label: YouTube
        widget: string
        required: false
      - name: tiktok
        label: TikTok
        widget: string
        required: false
      - name: facebook
        label: Facebook
        widget: string
        required: false
      - name: instagram
        label: Instagram
        widget: string
        required: false
    - name: radio
      label: Webradio
      widget: object
      fields:
      - name: nom
        label: Nom de la radio
        widget: string
      - name: streamUrl
        label: Adresse du flux audio (vide = radio pas encore lancée)
        widget: string
        required: false
      - name: nowPlayingUrl
        label: 'Adresse « titre en cours » (AzuraCast : /api/nowplaying/NOM)'
        widget: string
        required: false
      - name: message
        label: Message affiché avant le lancement
        widget: string
      - name: traductions
        label: 'Traductions (facultatif : le français s''affiche si vide)'
        widget: object
        required: false
        collapsed: true
        fields:
        - name: pt
          label: Português
          widget: object
          required: false
          collapsed: true
          fields:
          - name: message
            label: Message avant le lancement
            widget: string
            required: false
        - name: en
          label: English
          widget: object
          required: false
          collapsed: true
          fields:
          - name: message
            label: Message avant le lancement
            widget: string
            required: false
        - name: nl
          label: Nederlands
          widget: object
          required: false
          collapsed: true
          fields:
          - name: message
            label: Message avant le lancement
            widget: string
            required: false
        - name: es
          label: Español
          widget: object
          required: false
          collapsed: true
          fields:
          - name: message
            label: Message avant le lancement
            widget: string
            required: false
    - name: formulaires
      label: Formulaires (adresses Formspree, vide = message d'attente)
      widget: object
      fields:
      - name: candidature
        label: Candidature
        widget: string
        required: false
