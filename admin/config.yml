        widget: string
    - name: traductions
      label: 'Traductions (facultatif : le français s''affiche si vide)'
      widget: object
      required: false
      collapsed: true
      fields:
      - name: pt
        label: Português
        widget: object
        required: false
        collapsed: true
        fields:
        - name: slogan
          label: Slogan
          widget: string
          required: false
        - name: presentation
          label: Présentation
          widget: text
          required: false
      - name: en
