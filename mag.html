<body data-page="mag" data-title-key="nav.mag">
<div id="site-header"></div>
<main id="main">
<section class="page-head"><div class="wrap">
<p class="eyebrow" data-i18n="mag.eyebrow">Webzine mensuel</p>
<h1 class="display">Yapok Mag</h1>
<p class="lead" data-i18n="mag.lead">Chaque mois, des portraits, des reportages, le patrimoine et l&#x27;agenda de l&#x27;Est guyanais.</p>
</div></section><section class="section"><div class="wrap" id="mag-current"></div></section>
<section class="section band-dark"><div class="wrap split">
<div class="stack"><p class="eyebrow" data-i18n="nl.eyebrow">Lettre d&#x27;information</p><h2 class="display" style="font-size:clamp(1.7rem,1.1rem + 2vw,2.5rem)" data-i18n="nl.title">Recevoir Yapok Mag</h2><p class="muted" data-i18n="nl.text">Un e-mail par mois pour être prévenu de la sortie du magazine. Désinscription en un clic.</p></div>
<form class="form" data-form="newsletter" data-success-key="nl.success" style="color:var(--ink)">
<div class="field"><label for="nl-email"><span data-i18n="nl.email">Adresse e-mail</span></label><input id="nl-email" name="email" type="email" required autocomplete="email" placeholder="vous@exemple.fr" data-i18n-ph="nl.placeholder"></div>
<label class="choice" for="nl-ok"><input id="nl-ok" name="consentement" type="checkbox" required> <span data-i18n="nl.consent">J'accepte de recevoir la lettre d'information de Yapok Média.</span></label>
<button class="btn btn-primary" type="submit" data-i18n="nl.submit">S'inscrire</button>
<p class="form-status" role="status" hidden></p>
</form>
</div></section>
<section class="section"><div class="wrap">
<div class="section-head"><div><p class="eyebrow" data-i18n="mag.archEyebrow">Archives</p><h2 data-i18n="mag.archTitle">Numéros précédents</h2></div></div>
<div class="grid grid-3" id="mag-archives"></div>
</div></section>
